<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org; connect-src http://127.0.0.1:8000 http://localhost:8000; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="api-base" content="http://127.0.0.1:8000" />
  <title>API de Filmes (TMDB)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>API de Filmes (TMDB)</h1>
    <div id="status" class="status status--pendente">verificando servidor...</div>
  </header>

  <main>
    <form id="form-busca">
      <input type="text" id="campo-titulo" placeholder="Matrix ou uma comédia recente" aria-label="Título ou preferências" required maxlength="200" />
      <input type="number" id="campo-ano" placeholder="Ano (opcional)" min="1874" max="9998" aria-label="Ano de lançamento" />
      <select id="modo-busca" aria-label="Tipo de busca">
        <option value="auto">Automático</option>
        <option value="titulo">Título</option>
        <option value="descoberta">Preferências</option>
      </select>
      <button type="submit">Buscar</button>
    </form>

    <p id="mensagem" class="mensagem" role="status"></p>

    <section id="resultados" class="grid" aria-live="polite"></section>
  </main>

  <div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-label="Detalhes do filme">
    <div class="modal__conteudo">
      <button id="fechar-modal" class="modal__fechar" type="button" aria-label="Fechar">&times;</button>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
